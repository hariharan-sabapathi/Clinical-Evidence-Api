name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DATABASE_URL: postgresql+asyncpg://clinical_runtime:runtimepassword@localhost:5432/clinical_evidence
  DATABASE_URL_MIGRATOR: postgresql+asyncpg://clinical_app:devpassword@localhost:5432/clinical_evidence
  TEST_DATABASE_URL: postgresql+asyncpg://clinical_runtime:runtimepassword@localhost:5432/clinical_evidence
  TEST_DATABASE_URL_MIGRATOR: postgresql+asyncpg://clinical_app:devpassword@localhost:5432/clinical_evidence
  TEST_REDIS_URL: redis://localhost:6379/0
  REDIS_URL: redis://localhost:6379/0
  JWT_SECRET: ci-test-secret-not-for-real-use-32bytes

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check app/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[service,service-dev]"
      - run: mypy --strict app/

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinical_evidence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[service,service-dev]"
      - name: Bootstrap roles + pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d clinical_evidence -f docker/init-db.sql
      - name: Migration cycle (up -> down -1 -> up)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  test:
    runs-on: ubuntu-latest
    needs: [migrations]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: clinical_evidence
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[service,service-dev,llm]"
      - name: Bootstrap roles + pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d clinical_evidence -f docker/init-db.sql
      - run: alembic upgrade head
      - run: pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=75

  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[service]" pip-audit
      - run: pip-audit --strict --desc -f json | tee pip-audit.json
        continue-on-error: false

  build-image:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: clinical-evidence-api:${{ github.sha }}

  # No deploy job: Render auto-deploys from GitHub on push to main, so a CI
  # step here would just be a second, redundant deploy path.
